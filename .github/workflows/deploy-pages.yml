name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN || 'beta-view.ystuty.ru' }}
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://gg-api.ystuty.ru/s/schedule' }}
  VITE_GENERATE_SOURCEMAP: 'false'
  VITE_MAIN_HOST: ${{ vars.PAGES_DOMAIN || 'beta-view.ystuty.ru' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Check TypeScript
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      - name: Add version metadata
        run: node -e "const fs = require('node:fs'); const { version } = require('./package.json'); fs.writeFileSync('build/version.json', JSON.stringify({ version }) + '\n');"

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
