name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      HUSKY: 0
      # vars https://github.com/YSTUty/ystuty-schedule-web-view/settings/variables/actions
      PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN || 'beta-view.ystuty.ru' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://gg-api.ystuty.ru/s/schedule' }}
      VITE_API_URL_INTERNAL: ${{ vars.VITE_API_URL_INTERNAL }}
      # VITE_GENERATE_SOURCEMAP: 'false'
      VITE_LINK_YSTUTY: ${{ vars.VITE_LINK_YSTUTY }}
      VITE_LINK_2GH: ${{ vars.VITE_LINK_2GH }}
      VITE_LINK_2VK: ${{ vars.VITE_LINK_2VK }}
      VITE_LINK_2ICS: ${{ vars.VITE_LINK_2ICS }}
      VITE_LINK_SUPPORT: ${{ vars.VITE_LINK_SUPPORT }}
      VITE_MAIN_HOST: ${{ vars.PAGES_DOMAIN || 'beta-view.ystuty.ru' }}
      VITE_TELEGRAM_USERNAME: ${{ vars.VITE_TELEGRAM_USERNAME }}
      VITE_TELEGRAM_BOT_NAME: ${{ vars.VITE_TELEGRAM_BOT_NAME }}
      VITE_VK_BOT_GROUP_NAME: ${{ vars.VITE_VK_BOT_GROUP_NAME }}
      VITE_VK_WIDGETS_API_ID: ${{ vars.VITE_VK_WIDGETS_API_ID }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_YM_ID: ${{ vars.VITE_YM_ID }}
      VITE_HAWK_TOKEN: ${{ secrets.VITE_HAWK_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Check TypeScript
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      - name: Add version metadata
        run: node -e "const fs = require('node:fs'); const { version } = require('./package.json'); fs.writeFileSync('build/version.json', JSON.stringify({ version }) + '\n');"

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
